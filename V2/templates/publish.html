{% extends "base.html" %}

{% block title %}发布新搭子 - 寻搭子平台{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center fw-bold text-primary">📝 发布新搭子</h3>

                <!-- Flash 消息显示区 (处理必填项报错) -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('publish') }}">
                    <!-- 标题 -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">标题</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="例如：周末图书馆考研搭子" required>
                    </div>

                    <!-- 分类 -->
                    <div class="mb-3">
                        <label for="category" class="form-label fw-bold">分类</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="" disabled selected>请选择分类...</option>
                            <option value="学习">📚 学习</option>
                            <option value="运动">🏃 运动</option>
                            <option value="游戏">🎮 游戏</option>
                            <option value="干饭">🍔 干饭</option>
                            <option value="其他">✨ 其他</option>
                        </select>
                    </div>

                    <!-- 地点与时间 (并排显示) -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="location" class="form-label fw-bold">地点</label>
                            <input type="text" class="form-control" id="location" name="location" placeholder="例如：市图书馆3楼" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="time" class="form-label fw-bold">时间</label>
                            <input type="text" class="form-control" id="time" name="time" placeholder="例如：周六 09:00" required>
                        </div>
                    </div>

                    <!-- 描述 -->
                    <div class="mb-4">
                        <label for="description" class="form-label fw-bold">详细描述</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="说说你的具体要求、人数限制等..." required></textarea>
                    </div>

                    <!-- 提交按钮 -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5">立即发布</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
