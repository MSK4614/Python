<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}寻搭子平台{% endblock %}</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .floating-add-btn {
            width: 56px;
            height: 56px;
            font-size: 24px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-user-friends me-2"></i>寻搭子</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('publish') }}">发布搭子</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">我的</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- 悬浮添加按钮 -->
    <a href="{{ url_for('publish') }}" class="btn btn-primary rounded-circle shadow-lg position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center floating-add-btn" title="发布搭子" aria-label="发布搭子">
        <i class="fas fa-plus"></i>
    </a>

    <!-- 页脚 -->
    <footer class="text-center text-muted py-4 mt-auto border-top bg-white">
        <small>&copy; 2026.6 寻搭子实训项目 | Flask + Bootstrap 5</small>
    </footer>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
