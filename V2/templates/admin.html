{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>🛠️ 管理后台</h2>
    
    <!-- 情况A：未登录时，显示口令输入框 -->
    {% if not session.get('admin') %}
    <div class="row justify-content-center mt-3">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="password" class="form-label">请输入管理口令</label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">验证口令</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 情况B：已验证登录，显示数据列表和删除按钮 -->
    {% else %}
    <p class="text-muted">欢迎管理员！以下是所有搭子信息：</p>
    <table class="table table-striped table-hover mt-3">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>标题</th>
                <th>分类</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for p in partners %}
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.title }}</td>
                <td>{{ p.category }}</td>
                <td>
                    <form action="{{ url_for('update_status', partner_id=p.id) }}" method="POST" class="d-inline">
                        <label for="status-select">快速修改状态：</label>
                        <select
                            name="status"
                            class="form-select form-select-sm d-inline-block w-auto"
                            aria-label="快速修改状态"
                            onchange="this.form.submit()"
                        >
                            <option value="招募中" {% if p.status == '招募中' %}selected{% endif %}>招募中</option>
                            <option value="已满员" {% if p.status == '已满员' %}selected{% endif %}>已满员</option>
                            <option value="已结束" {% if p.status == '已结束' %}selected{% endif %}>已结束</option>
                        </select>
                    </form>
                </td>
                <td>
                    <a href="{{ url_for('delete', partner_id=p.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('确定要删除这条信息吗？');">删除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% endif %}
</div>
{% endblock %}
